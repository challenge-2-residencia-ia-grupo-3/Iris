site_name: "Íris — Plataforma Inteligente de Adaptação Pedagógica"
site_description: "Documentação oficial do Projeto Íris (Challenge 2 - Residência em IA: UnB / Lab Livre / Eldorado / Softex / MCTI)"
site_author: "Grupo 3 - Residência em IA"
site_url: "https://challenge-2-residencia-ia-grupo-3.github.io/Iris/"

theme:
  name: material
  language: pt-BR
  logo: assets/logo.jpg
  favicon: assets/favicon.png
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs          # Barra de navegacao horizontal no topo
    - navigation.tabs.sticky   # Mantem a barra horizontal visivel ao rolar
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.view

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/extra.js

nav:
  - Início: index.md
  - Entrega Semanal: definicao_projeto_entrega.md
  - Visão do Produto: visao_produto.md
  - Requisitos:
      - Requisitos Funcionais: requisitos_funcionais.md
      - Requisitos Não Funcionais: requisitos_nao_funcionais.md
      - Backlog & Rastreabilidade: backlog_rastreabilidade.md
  - Arquitetura: arquitetura.md
  - Agentes:
      - Agente Auditor: agente_auditor.md
  - Perfil Pedagógico: perfil_pedagogico.md
  - Base de Conhecimento e RAG:
      - Relatório Técnico: rag/relatorio.md
      - Arquitetura do RAG: rag/arquitetura.md
      - Avaliação do RAG: rag/avaliacao.md
  - Metodologia CBL: cbl.md
  - Catálogo de Skills: skills.md
  - Roteiro de Testes: roteiro_testes.md
