name: Qualidade Noturna (Warnings e Grafo)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualidade-noturna:
    name: Testes LangGraph e Auditoria de Warnings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependências + grupo grafo
        run: uv sync --frozen --group grafo

      - name: Rodar testes do protótipo LangGraph
        run: uv run --frozen --group grafo python -m unittest discover -s rag/iris-rag/bancada/langgraph -p "test_*.py" -v

      - name: Rodar suíte backend medindo durações e warnings
        run: |
          set +e
          uv run --frozen python -m pytest backend/tests -W default --durations=20 -q > pytest_nightly.log 2>&1
          PYTEST_EXIT=$?
          set -e
          echo '### Top 20 testes mais lentos e resumo de warnings' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 pytest_nightly.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat pytest_nightly.log
          exit $PYTEST_EXIT
        env:
          PYTHONPATH: backend/src
