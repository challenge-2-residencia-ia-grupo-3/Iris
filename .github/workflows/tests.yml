name: Testes

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependências travadas no uv.lock
        run: uv sync --frozen

      # OCR de provas digitalizadas (História 1.1.3): o Tesseract é um programa do sistema, não um pacote Python.
      # Sem ele os testes de acurácia são pulados, mas a leitura de imagens real fica sem cobertura.
      - name: Instalar o Tesseract (OCR em português)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por

      - name: Auditoria Zero-Database e Arquitetura Stateless (RNF-01)
        run: uv run --frozen python scripts/audit_zero_database.py

      # pytest coleta os testes em estilo unittest e os em estilo pytest (funções e parametrize).
      # `unittest discover` só enxerga os primeiros e deixava parte da suíte fora do CI.
      - name: Rodar a suíte
        run: uv run --frozen --with coverage coverage run --branch --source=backend/src/iris -m pytest backend/tests
        env:
          PYTHONPATH: backend/src

      - name: Relatório de cobertura (informativo, sem mínimo exigido)
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run --frozen --with coverage coverage report >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (tipos e vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências travadas no package-lock.json
        run: npm ci

      - name: Checar os tipos
        run: npx tsc --noEmit

      - name: Rodar os testes
        run: npm test
