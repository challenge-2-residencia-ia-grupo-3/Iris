[project]
name = "iris"
version = "0.1.0"
description = "Plataforma Inteligente de Adaptação de Materiais Pedagógicos para Alunos Neurodivergentes (TDAH)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Challenge 2 - Residência em IA - Grupo 3" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pandas>=3.1.0",
    "numpy>=2.4.6",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "jupyter>=1.1.1",
    "ipykernel>=7.4.0",
    "tiktoken>=0.14.0",
    "pyphen>=0.18.1",
    "ragas>=0.4.3",
    "datasets>=5.1.0",
    "langchain-community<0.4",
]

[dependency-groups]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.15",
    "pymdown-extensions>=10.7",
    "mkdocs-minify-plugin>=0.8.0",
]
dev = [
    "pytest>=8.1.0",
    "black>=24.3.0",
    "ruff>=0.3.4",
]
rag = [
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "ragas>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris"]

[tool.uv]
package = false
default-groups = ["docs", "dev"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]