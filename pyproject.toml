[project]
name = "iris"
version = "0.1.0"
description = "Plataforma Inteligente de Adaptação de Materiais Pedagógicos para Alunos Neurodivergentes (TDAH)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Challenge 2 - Residência em IA - Grupo 3" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pandas>=3.1.0",
    "numpy>=2.4.6",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "jupyter>=1.1.1",
    "ipykernel>=7.4.0",
    "tiktoken>=0.14.0",
    "pyphen>=0.18.1",
    "ragas>=0.4.3",
    "datasets>=5.1.0",
    "langchain-community<0.4",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "rank-bm25>=0.2.2",
    "transformers>=5.22.1",
]

[dependency-groups]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.15",
    "pymdown-extensions>=10.7",
    "mkdocs-minify-plugin>=0.8.0",
]
dev = [
    "pytest>=8.1.0",
    "httpx>=0.27.0",
    "black>=24.3.0",
    "ruff>=0.3.4",
]
rag = [
    "torch>=2.2.0",
    "sentence-transformers>=2.7.0",
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "huggingface-hub>=0.23.0",
    "safetensors>=0.4.3",
    "numpy>=1.26.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
    "ragas>=0.1.9",
    "ipykernel>=6.29.0",
    "nbconvert>=7.16.0",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "jupyter-client>=8.6.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/iris"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]

[tool.uv]
package = true
default-groups = ["docs", "dev"]
