<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ponta" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/></marker></defs>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="40" y="32" font-size="18" font-weight="700" fill="#111827">Íris – Base de conhecimento e protótipo de RAG</text>
<text x="40" y="60" font-size="12" font-weight="700" fill="#0f766e" letter-spacing="0.5">INGESTÃO (a cada alteração da base)</text>
<rect x="40" y="70" width="172" height="112" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="52" y="94" font-size="14" font-weight="600" fill="#111827">1. Curadoria</text>
<text x="52" y="118" font-size="12" fill="#374151">38 documentos em 4 partes</text>
<text x="52" y="136" font-size="12" fill="#374151">fonte primária ou oficial</text>
<text x="52" y="154" font-size="12" fill="#374151">licença e SHA-256 anotados</text>
<rect x="230" y="70" width="172" height="112" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="242" y="94" font-size="14" font-weight="600" fill="#111827">2. Extração</text>
<text x="242" y="118" font-size="12" fill="#374151">PDF, HTML, DOCX e leis</text>
<text x="242" y="136" font-size="12" fill="#374151">marcação de página</text>
<text x="242" y="154" font-size="12" fill="#374151">sem texto revogado</text>
<line x1="214" y1="126" x2="227" y2="126" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ponta)"/>
<rect x="419" y="70" width="172" height="112" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="431" y="94" font-size="14" font-weight="600" fill="#111827">3. Segmentação</text>
<text x="431" y="118" font-size="12" fill="#374151">corte por título ou artigo</text>
<text x="431" y="136" font-size="12" fill="#374151">até 350 palavras</text>
<text x="431" y="154" font-size="12" fill="#374151">1.368 trechos</text>
<line x1="403" y1="126" x2="416" y2="126" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ponta)"/>
<rect x="609" y="70" width="172" height="112" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="621" y="94" font-size="14" font-weight="600" fill="#111827">4. Metadados</text>
<text x="621" y="118" font-size="12" fill="#374151">documento, página, seção</text>
<text x="621" y="136" font-size="12" fill="#374151">idioma, tipo de evidência</text>
<text x="621" y="154" font-size="12" fill="#374151">aviso de uso</text>
<line x1="593" y1="126" x2="606" y2="126" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ponta)"/>
<rect x="799" y="70" width="172" height="112" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="811" y="94" font-size="14" font-weight="600" fill="#111827">5. Embeddings</text>
<text x="811" y="118" font-size="12" fill="#374151">Qwen3: 1.024 dimensões</text>
<text x="811" y="136" font-size="12" fill="#374151">MPNet: 768 dimensões</text>
<text x="811" y="154" font-size="12" fill="#374151">BM25 em memória</text>
<line x1="783" y1="126" x2="796" y2="126" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ponta)"/>
<rect x="988" y="70" width="172" height="112" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="1000" y="94" font-size="14" font-weight="600" fill="#111827">6. Banco vetorial</text>
<text x="1000" y="118" font-size="12" fill="#374151">PostgreSQL 17 + pgvector</text>
<text x="1000" y="136" font-size="12" fill="#374151">tabela iris_trechos</text>
<text x="1000" y="154" font-size="12" fill="#374151">texto, metadados e vetores</text>
<line x1="972" y1="126" x2="985" y2="126" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ponta)"/>
<text x="40" y="280" font-size="12" font-weight="700" fill="#1d4ed8" letter-spacing="0.5">CONSULTA (a cada requisição)</text>
<rect x="40" y="290" width="172" height="112" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="52" y="314" font-size="14" font-weight="600" fill="#111827">1. Consulta</text>
<text x="52" y="338" font-size="12" fill="#374151">professor ou</text>
<text x="52" y="356" font-size="12" fill="#374151">Agente Estrategista</text>
<rect x="230" y="290" width="172" height="112" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="242" y="314" font-size="14" font-weight="600" fill="#111827">2. Vetorização</text>
<text x="242" y="338" font-size="12" fill="#374151">Qwen3, com</text>
<text x="242" y="356" font-size="12" fill="#374151">instrução de busca</text>
<line x1="214" y1="346" x2="227" y2="346" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ponta)"/>
<rect x="419" y="290" width="172" height="112" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="431" y="314" font-size="14" font-weight="600" fill="#111827">3. Busca vetorial</text>
<text x="431" y="338" font-size="12" fill="#374151">50 trechos mais similares</text>
<text x="431" y="356" font-size="12" fill="#374151">distância de cosseno</text>
<text x="431" y="374" font-size="12" fill="#374151">consulta SQL</text>
<line x1="403" y1="346" x2="416" y2="346" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ponta)"/>
<rect x="609" y="290" width="172" height="112" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="621" y="314" font-size="14" font-weight="600" fill="#111827">4. Reordenação</text>
<text x="621" y="338" font-size="12" fill="#374151">cross-encoder avalia cada</text>
<text x="621" y="356" font-size="12" fill="#374151">par consulta–trecho;</text>
<text x="621" y="374" font-size="12" fill="#374151">seleciona 5</text>
<line x1="593" y1="346" x2="606" y2="346" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ponta)"/>
<rect x="799" y="290" width="172" height="112" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="811" y="314" font-size="14" font-weight="600" fill="#111827">5. Geração</text>
<text x="811" y="338" font-size="12" fill="#374151">restrita aos 5 trechos</text>
<text x="811" y="356" font-size="12" fill="#374151">citação por frase</text>
<text x="811" y="374" font-size="12" fill="#374151">recusa por insuficiência</text>
<line x1="783" y1="346" x2="796" y2="346" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ponta)"/>
<rect x="988" y="290" width="172" height="112" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="1000" y="314" font-size="14" font-weight="600" fill="#111827">6. Evidência</text>
<text x="1000" y="338" font-size="12" fill="#374151">documento, página e</text>
<text x="1000" y="356" font-size="12" fill="#374151">endereço por frase</text>
<text x="1000" y="374" font-size="12" fill="#374151">citações verificadas</text>
<line x1="972" y1="346" x2="985" y2="346" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ponta)"/>
<path d="M1074,182 L1074,226 L505,226 L505,286" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ponta)"/>
<text x="790" y="219" font-size="11" fill="#6b7280" text-anchor="middle">vetores gravados na ingestão</text>
<text x="40" y="460" font-size="12" font-weight="700" fill="#6b7280" letter-spacing="0.5">AVALIAÇÃO (fora do fluxo de resposta)</text>
<rect x="40" y="470" width="361" height="92" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="52" y="494" font-size="14" font-weight="600" fill="#111827">Conjunto de referência</text>
<text x="52" y="518" font-size="12" fill="#374151">40 consultas elaboradas antes da busca;</text>
<text x="52" y="536" font-size="12" fill="#374151">trechos relevantes identificados por modelo</text>
<rect x="419" y="470" width="361" height="92" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="431" y="494" font-size="14" font-weight="600" fill="#111827">Recuperação</text>
<text x="431" y="518" font-size="12" fill="#374151">recall@5 e consultas com ao menos</text>
<text x="431" y="536" font-size="12" fill="#374151">um trecho relevante entre os 5</text>
<rect x="799" y="470" width="361" height="92" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="811" y="494" font-size="14" font-weight="600" fill="#111827">Respostas</text>
<text x="811" y="518" font-size="12" fill="#374151">dois avaliadores automáticos classificam cada</text>
<text x="811" y="536" font-size="12" fill="#374151">frase e transcrevem a passagem do trecho</text>
</svg>
